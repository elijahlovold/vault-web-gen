[package]
name = "vault-web-gen"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
comrak = { version = "0.57.0", default-features = false, features = ["syntect-fancy"] }
globset = "0.4.20"
pbkdf2 = "0.13.0"
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tiny_http = "0.12.0"
toml = "1.1.8"
toml_edit = "0.25.17"
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2.5.0"
